apiVersion: 1
datasources:
  - name: EMS ClickHouse
    uid: ems-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: ems
      username: grafana_reader
      queryTimeout: 60
      validateSql: true
    secureJsonData:
      password: ''

services:
  postgres:
    image: postgres:16
    container_name: ems-postgres-batch
    restart: unless-stopped
    environment:
      POSTGRES_DB: ems_dw
      POSTGRES_USER: ems_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to .env}
    ports:
      - "5435:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/create_ems_dw.sql:/docker-entrypoint-initdb.d/01_create_ems_dw.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_admin -d ems_dw"]
      interval: 10s
      timeout: 5s
      retries: 12
